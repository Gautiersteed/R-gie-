<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Régie Mobile Autonome</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --panel-bg: #1f1f1f;
            --accent-color: #ff0000;
            --text-color: #f1f1f1;
            --text-muted: #aaa;
            --border-color: #383838;
            --success-color: #2ba640;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .chat-panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: 350px;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .chat-panel iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 0 0 12px 12px;
        }

        .panel-header {
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            width: 100%;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .grid-inputs {
                grid-template-columns: 1fr 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: background 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Bouton Google Connexion par défaut */
        #loginBtn {
            background-color: var(--accent-color);
        }

        /* NOUVEAU : Bouton Forcer le réveil configuré en ROUGE */
        .btn-danger {
            background-color: var(--accent-color) !important;
            color: white !important;
        }
        .btn-danger:hover {
            background-color: #cc0000 !important;
        }

        .status-box {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8em;
            border-left: 4px solid var(--accent-color);
            margin-top: 10px;
            word-break: break-word;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.05em;
        }
    </style>
    
    <script src="https://google.com" async defer></script>
</head>
<body>

<div class="container">
    <div class="main-panel">
        
        <!-- Lecteur natif Iframe -->
        <div class="video-container" id="mediaWrapper">
            <iframe id="ytPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="card">
            <div class="panel-header" style="padding:0 0 10px 0;">
                <span>🔐 Console Google API & Liaison</span>
                <button class="btn" id="loginBtn" onclick="handleAuthClick()" style="width:auto; padding:8px 15px;">Connexion</button>
            </div>
            <div style="margin-top:8px;">
                <label for="clientIdInput">ID Client OAuth 2.0 :</label>
                <input type="text" id="clientIdInput" placeholder="Collez l'ID de la console Google Cloud">
            </div>
            <div class="grid-inputs" style="margin-top: 5px;">
                <div>
                    <label for="videoIdInput">ID Vidéo YouTube :</label>
                    <input type="text" id="videoIdInput" value="06Ucv-ZcPWg">
                </div>
                <div>
                    <label for="domainInput">Domaine d'Hébergement :</label>
                    <input type="text" id="domainInput" value="gautiersteed.github.io">
                </div>
            </div>
            <!-- CONFIGURATION : Bouton en classe rouge (btn-danger) -->
            <button class="btn btn-danger" onclick="updateFramesUrls()" style="margin-top:10px;">🔄 Forcer le réveil du Lecteur</button>
        </div>

        <div class="card">
            <h3>⏱️ Horaires Automatiques (Orchestration API Native)</h3>
            <div class="grid-inputs">
                <div>
                    <label for="startTime">Heure de Début :</label>
                    <input type="datetime-local" id="startTime">
                </div>
                <div>
                    <label for="endTime">Heure de Fin :</label>
                    <input type="datetime-local" id="endTime">
                </div>
            </div>
            <button class="btn" onclick="scheduleLiveBroadcast()" style="margin-top:15px; background-color: var(--panel-bg); border: 1px solid var(--border-color);">Planifier & Activer la Synchronisation</button>
            <div class="status-box" id="systemLog">Système : Prêt. En attente d'une action...</div>
        </div>
    </div>

    <div class="chat-panel">
        <div class="panel-header">
            <span>💬 Chat en Direct</span>
        </div>
        <iframe id="ytChat" src=""></iframe>
    </div>
</div>

<script>
    const database = localStorage;
    const logBox = document.getElementById('systemLog');
    let tokenClient = null;

    window.addEventListener('DOMContentLoaded', () => {
        // Initialisation de la mémoire locale de l'appareil si elle est vide
        if (!database.getItem('videoIdInput')) {
            database.setItem('videoIdInput', '06Ucv-ZcPWg');
        }
        if (!database.getItem('domainInput')) {
            database.setItem('domainInput', 'gautiersteed.github.io');
        }

        const fields = ['clientIdInput', 'videoIdInput', 'domainInput', 'startTime', 'endTime'];
        fields.forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                if (database.getItem(id)) {
                    element.value = database.getItem(id);
                }
                element.addEventListener('input', saveData);
            }
        });
        
        // Premier réveil automatique au chargement
        updateFramesUrls();
    });

    function saveData() {
        database.setItem(this.id, this.value);
        if (this.id === 'videoIdInput' || this.id === 'domainInput') {
            updateFramesUrls();
        }
    }

    function log(message) {
        logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
    }

    // CORRECTION : Résolution complète de la fonction coupée et sécurisation des variables du DOM
    function updateFramesUrls() {
        const videoIdField = document.getElementById('videoIdInput');
        const domainField = document.getElementById('domainInput');
        const playerFrame = document.getElementById('ytPlayer');
        const chatFrame = document.getElementById('ytChat');

        if (!videoIdField || !domainField || !playerFrame || !chatFrame) {
            log("❌ Erreur : Structure du DOM brisée ou manquante.");
            return;
        }

        const videoId = videoIdField.value.trim();
        const domain = domainField.value.trim();

        if (!videoId) {
            log("❌ Erreur : Aucun ID de vidéo YouTube renseigné.");
            return;
        }

        // Mise à jour sécurisée de l'iframe vidéo
        playerFrame.src = `https://youtube.com{videoId}?autoplay=1&origin=https://${domain}&enablejsapi=1`;

        // Mise à jour de l'iframe Chat en direct
        if (domain) {
