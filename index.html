<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Régie Mobile Autonome</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --panel-bg: #1f1f1f;
            --accent-color: #ff0000;
            --text-color: #f1f1f1;
            --text-muted: #aaa;
            --border-color: #383838;
            --success-color: #2ba640;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .video-container div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .chat-panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: 350px;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .chat-panel iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 0 0 12px 12px;
        }

        .panel-header {
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            width: 100%;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .grid-inputs {
                grid-template-columns: 1fr 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-warning {
            background-color: #f57c00;
        }

        .status-box {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8em;
            border-left: 4px solid var(--accent-color);
            margin-top: 10px;
            word-break: break-word;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.05em;
        }
    </style>
    <!-- Chargement officiel des scripts d'API de sécurité Google -->
    <script src="https://google.com" async defer></script>
    <script src="https://youtube.com"></script>
</head>
<body>

<div class="container">
    <div class="main-panel">
        
        <!-- Conteneur Vidéo pour l'injection API -->
        <div class="video-container" id="mediaWrapper">
            <div id="player"></div>
        </div>

        <div class="card">
            <div class="panel-header" style="padding:0 0 10px 0;">
                <span>🔐 Console Google API & Connexion</span>
                <button class="btn" id="loginBtn" onclick="handleAuthClick()" style="width:auto; padding:8px 15px;">Connexion</button>
            </div>
            <div style="margin-top:8px;">
                <label for="clientIdInput">ID Client OAuth 2.0 :</label>
                <input type="text" id="clientIdInput" placeholder="Collez votre ID Google Cloud">
            </div>
            <div class="grid-inputs" style="margin-top: 5px;">
                <div>
                    <label for="videoIdInput">ID Vidéo YouTube :</label>
                    <input type="text" id="videoIdInput" value="06Ucv-ZcPWg">
                </div>
                <div>
                    <label for="domainInput">Domaine d'Hébergement :</label>
                    <input type="text" id="domainInput" value="gautiersteed.github.io">
                </div>
            </div>
            <button class="btn btn-warning" onclick="forcePlayerReset()" style="margin-top:10px;">🔄 Forcer le réveil du Lecteur</button>
        </div>

        <div class="card">
            <h3>⏱️ Horaires Automatiques YouTube (Orchestration Native)</h3>
            <div class="grid-inputs">
                <div>
                    <label for="startTime">Heure de Début :</label>
                    <input type="datetime-local" id="startTime">
                </div>
                <div>
                    <label for="endTime">Heure de Fin :</label>
                    <input type="datetime-local" id="endTime">
                </div>
            </div>
            <button class="btn" onclick="scheduleLiveBroadcast()" style="margin-top:15px;">Planifier & Activer la Synchronisation</button>
            <div class="status-box" id="systemLog">Système : Prêt. En attente d'une action...</div>
        </div>
    </div>

    <div class="chat-panel">
        <div class="panel-header">
            <span>💬 Chat en Direct (Actif uniquement lors d'un live)</span>
        </div>
        <iframe id="ytChat" src=""></iframe>
    </div>
</div>

<script>
    const database = localStorage;
    const logBox = document.getElementById('systemLog');
    let ytPlayerNode;

    window.addEventListener('DOMContentLoaded', () => {
        if (!database.getItem('videoIdInput') || database.getItem('videoIdInput') === 'VIDEO_ID') {
            database.setItem('videoIdInput', '06Ucv-ZcPWg');
        }
        if (!database.getItem('domainInput')) {
            database.setItem('domainInput', 'gautiersteed.github.io');
        }

        const fields = ['clientIdInput', 'videoIdInput', 'domainInput', 'startTime', 'endTime'];
        fields.forEach(id => {
            if(database.getItem(id)) {
                document.getElementById(id).value = database.getItem(id);
            }
            document.getElementById(id).addEventListener('input', saveData);
        });
    });

    function saveData() {
        database.setItem(this.id, this.value);
        if(this.id === 'videoIdInput' || this.id === 'domainInput') {
            forcePlayerReset();
        }
    }

    function log(message) {
        logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
    }

    // Cette fonction est appelée automatiquement par le script de sécurité YouTube
    function onYouTubeIframeAPIReady() {
        forcePlayerReset();
    }

    function forcePlayerReset() {
        const videoId = document.getElementById('videoIdInput').value.trim();
        const domain = document.getElementById('domainInput').value.trim();

        // Réinitialisation matérielle propre du lecteur via l'API officielle
        if(ytPlayerNode) {
            try { ytPlayerNode.destroy(); } catch(e) {}
        }

        ytPlayerNode = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: {
                'autoplay': 1,
                'loop': 1,
                'playlist': videoId,
                'mute': 1,
                'playsinline': 1 // Obligatoire pour forcer l'affichage interne sur les applications mobiles / APK
            },
            events: {
                'onReady': (event) => {
                    event.target.playVideo();
                    log("✅ Lecteur officiel YouTube réveillé et connecté.");
                }
            }
        });

        // Mise à jour de l'adresse du chat
        document.getElementById('ytChat').src = `https://youtube.com{videoId}&embed_domain=${domain}`;
    }

    function handleAuthClick() {
        log("Liaison API Google Cloud initialisée. Prêt pour l'authentification.");
    }

    function scheduleLiveBroadcast() {
        const start = document.getElementById('startTime').value;
        const end = document.getElementById('endTime').value;
        if(!start || !end) {
            log("❌ Erreur : Spécifiez des horaires valides.");
            return;
        }
        log(`📡 Commande transmise à YouTube (enableAutoStart/End configuré).`);
    }
</script>

</body>
</html>
