<script>
    const database = localStorage;
    const logBox = document.getElementById('systemLog');
    let scheduleTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
        // Initialisation des valeurs par défaut si le localStorage est vide
        if (!database.getItem('videoIdInput')) database.setItem('videoIdInput', '06Ucv-ZcPWg');
        if (!database.getItem('domainInput')) database.setItem('domainInput', 'gautiersteed.github.io');

        const fields = ['clientIdInput', 'videoIdInput', 'domainInput', 'startTime', 'endTime'];
        fields.forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                if (database.getItem(id)) {
                    element.value = database.getItem(id);
                }
                element.addEventListener('input', saveData);
            }
        });
        
        updateFramesUrls();
    });

    function saveData() {
        database.setItem(this.id, this.value);
        if (this.id === 'videoIdInput' || this.id === 'domainInput') {
            updateFramesUrls();
        }
    }

    function log(message) {
        logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
    }

    // Génère les URL natives YouTube optimisées pour mobile avec boucle automatique
    function updateFramesUrls() {
        const videoId = document.getElementById('videoIdInput').value.trim();
        const domain = document.getElementById('domainInput').value.trim();
        
        if (!videoId) {
            log("⚠️ ID Vidéo manquant.");
            return;
        }

        const playerIframe = document.getElementById('ytPlayer');
        const chatIframe = document.getElementById('ytChat');

        // Paramètres : boucle activée (loop=1&playlist=ID), muet par défaut pour l'autoplay mobile (mute=1)
        const playerUrl = `https://youtube.com{videoId}?autoplay=1&loop=1&playlist=${videoId}&mute=1&origin=https://${domain}`;
        const chatUrl = `https://youtube.com{videoId}&embed_domain=${domain}`;

        if (playerIframe.src !== playerUrl) playerIframe.src = playerUrl;
        if (chatIframe.src !== chatUrl) chatIframe.src = chatUrl;
        
        log("🔄 Lecteur et Chat synchronisés.");
    }

    // Orchestration horaire simplifiée (Native)
    function scheduleLiveBroadcast() {
        if (scheduleTimer) clearInterval(scheduleTimer);

        const startTimeVal = document.getElementById('startTime').value;
        const endTimeVal = document.getElementById('endTime').value;

        if (!startTimeVal || !endTimeVal) {
            log("⚠️ Veuillez configurer les heures de début et de fin.");
            return;
        }

        const startMs = new Date(startTimeVal).getTime();
        const endMs = new Date(endTimeVal).getTime();

        log("⏳ Surveillance horaire activée...");

        scheduleTimer = setInterval(() => {
            const now = Date.now();

            if (now >= startMs && now < endMs) {
                if (document.getElementById('mediaWrapper').style.display === 'none') {
                    document.getElementById('mediaWrapper').style.display = 'block';
                    updateFramesUrls();
                    log("🟢 Diffusion en cours (Tranche horaire active).");
                }
            } else {
                if (document.getElementById('mediaWrapper').style.display !== 'none') {
                    document.getElementById('mediaWrapper').style.display = 'none';
                    document.getElementById('ytPlayer').src = "";
                    document.getElementById('ytChat').src = "";
                    log("🔴 Hors plage horaire. Lecteur mis en veille.");
                }
            }
        }, 5000); // Vérification légère toutes les 5 secondes
    }

    // Emplacement pour votre logique de connexion Google API
    function handleAuthClick() {
        const clientId = document.getElementById('clientIdInput').value.trim();
        if (!clientId) {
            log("⚠️ Configurez d'abord votre ID Client OAuth 2.0.");
            return;
        }
        log("🔐 Initialisation de l'authentification Google Cloud...");
        // Ajoutez vos scripts gapi / tokenClient natifs ici si nécessaire
    }
</script>
</body>
</html>
