<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Régie Mobile Autonome</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --panel-bg: #1f1f1f;
            --accent-color: #ff0000;
            --text-color: #f1f1f1;
            --text-muted: #aaa;
            --border-color: #383838;
            --success-color: #2ba640;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .video-container iframe, .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .chat-panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: 350px;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .chat-panel iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 0 0 12px 12px;
        }

        .panel-header {
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            flex-wrap: wrap;
            gap: 5px;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            width: 100%;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .grid-inputs {
                grid-template-columns: 1fr 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        @media (min-width: 400px) {
            .btn-group {
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .codec-badge {
            background-color: #0056b3;
            color: #fff;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
        }

        .status-box {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8em;
            border-left: 4px solid var(--accent-color);
            margin-top: 10px;
            word-break: break-word;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.05em;
        }
    </style>
    <script src="https://google.com" async defer></script>
</head>
<body>

<div class="container">
    <div class="main-panel">
        
        <div class="video-container" id="mediaWrapper">
            <iframe id="ytPlayer" src="" allowfullscreen></iframe>
            <video id="localPreview" controls muted style="display:none;"></video>
        </div>

        <div class="card">
            <div class="panel-header" style="padding:0 0 10px 0;">
                <span>🔐 Console Google API & App</span>
                <button class="btn" id="loginBtn" onclick="handleAuthClick()" style="width:auto; padding:8px 15px;">Connexion</button>
            </div>
            <div style="margin-top:8px;">
                <label for="clientIdInput">ID Client OAuth 2.0 :</label>
                <input type="text" id="clientIdInput" placeholder="Collez l'ID de la console Google">
            </div>
            <div class="grid-inputs" style="margin-top: 5px;">
                <div>
                    <label for="videoIdInput">ID Vidéo YouTube :</label>
                    <input type="text" id="videoIdInput" value="VIDEO_ID">
                </div>
                <div>
                    <label for="domainInput">Domaine d'Hébergement :</label>
                    <input type="text" id="domainInput" value="gautiersteed.github.io">
                </div>
            </div>
        </div>

        <div class="card">
            <h3>📡 Points d'Ingestion RTMP</h3>
            <div>
                <label>Serveur Principal :</label>
                <input type="text" value="rtmp://://youtube.com" readonly style="background-color: #2b2b2b;">
            </div>
            <div style="margin-top:5px;">
                <label>Clé de flux (Générée automatiquement) :</label>
                <input type="password" id="streamKey" value="••••••••••••••••" readonly style="background-color: #2b2b2b;">
            </div>
        </div>

        <div class="card">
            <h3>🎥 Compression Native Mobile</h3>
            <label for="videoFileInput">Fichier vidéo source :</label>
            <input type="file" id="videoFileInput" accept="video/*" onchange="loadLocalVideo(event)">
            
            <div class="grid-inputs" style="margin-top: 10px;">
                <div>
                    <label>Codec Image :</label>
                    <input type="text" value="H.264 High Level 4.2" readonly style="background-color: #2b2b2b;">
                </div>
                <div>
                    <label>Codec Audio :</label>
                    <select id="audioCodecSelect" onchange="toggleCodecBadge()">
                        <option value="AAC">AAC-LC (Stéréo 2 Ch)</option>
                        <option value="Opus">Opus (Haute fidélité)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>⏱️ Horaires Automatiques</h3>
            <div class="grid-inputs">
                <div>
                    <label for="startTime">Heure de Début :</label>
                    <input type="datetime-local" id="startTime">
                </div>
                <div>
                    <label for="endTime">Heure de Fin :</label>
                    <input type="datetime-local" id="endTime">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="scheduleLiveBroadcast()">Planifier le Live</button>
                <button class="btn btn-success" id="streamBtn" onclick="startDirectStreaming()">Flux Immédiat</button>
            </div>
            <div class="status-box" id="systemLog">Système : En attente du signal...</div>
        </div>
    </div>

    <div class="chat-panel">
        <div class="panel-header">
            <span>💬 Chat en Direct</span>
            <span class="codec-badge" id="activeCodecBadge">AAC (2 Ch)</span>
        </div>
        <iframe id="ytChat" src=""></iframe>
    </div>
</div>

<script>
    const database = localStorage;
    const logBox = document.getElementById('systemLog');
    let videoEncoder;

    window.addEventListener('DOMContentLoaded', () => {
        const fields = ['clientIdInput', 'videoIdInput', 'domainInput', 'startTime', 'endTime', 'audioCodecSelect'];
        fields.forEach(id => {
            if(database.getItem(id)) {
                document.getElementById(id).value = database.getItem(id);
            }
            document.getElementById(id).addEventListener('input', saveData);
        });
        updateFramesUrls();
        toggleCodecBadge();
    });

    function saveData() {
        database.setItem(this.id, this.value);
        if(this.id === 'videoIdInput' || this.id === 'domainInput') {
            updateFramesUrls();
        }
    }

    function log(message) {
        logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
    }

    function toggleCodecBadge() {
