<script>
    const database = localStorage;
    const logBox = document.getElementById('systemLog');

    // Variables pour l'API Google
    let tokenClient;
    let accessToken = null;

    window.addEventListener('DOMContentLoaded', () => {
        // Remplissage par défaut si la mémoire locale de l'appareil est vide
        if (!database.getItem('videoIdInput')) {
            database.setItem('videoIdInput', '06Ucv-ZcPWg');
        }
        if (!database.getItem('domainInput')) {
            database.setItem('domainInput', 'gautiersteed.github.io');
        }

        const fields = ['clientIdInput', 'videoIdInput', 'domainInput', 'startTime', 'endTime'];
        fields.forEach(id => {
            if(database.getItem(id)) {
                document.getElementById(id).value = database.getItem(id);
            }
            document.getElementById(id).addEventListener('input', saveData);
        });
        
        updateFramesUrls();
        initGoogleAuth();
    });

    function saveData() {
        database.setItem(this.id, this.value);
        if(this.id === 'videoIdInput' || this.id === 'domainInput') {
            updateFramesUrls();
        }
    }

    function log(message) {
        logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
    }

    // 🔄 Mise à jour dynamique des iFrames (Lecteur + Chat)
    function updateFramesUrls() {
        const videoId = document.getElementById('videoIdInput').value.trim();
        const domain = document.getElementById('domainInput').value.trim();

        if (!videoId) {
            log("❌ Erreur : ID Vidéo manquant.");
            return;
        }

        // URL du lecteur avec autoplay et origine sécurisée
        const playerUrl = `https://youtube.com{videoId}?autoplay=1&origin=https://${domain}&enablejsapi=1`;
        document.getElementById('ytPlayer').src = playerUrl;

        // URL du Chat en direct (nécessite obligatoirement un domaine valide)
        if (domain) {
            const chatUrl = `https://youtube.com{videoId}&embed_domain=${domain}`;
            document.getElementById('ytChat').src = chatUrl;
            log("🔄 Lecteur et Chat synchronisés avec succès.");
        } else {
            log("⚠️ Lecteur mis à jour, mais le Domaine est requis pour le Chat.");
        }
    }

    // 🔐 Initialisation de l'authentification Google Identity Services (GIS)
    function initGoogleAuth() {
        const clientId = document.getElementById('clientIdInput').value.trim();
        if (!clientId) {
            log("💡 En attente de l'ID Client OAuth pour activer les fonctionnalités API.");
            return;
        }

        // Chargement du script Google Identity Services si non présent
        if (!window.google || !window.google.accounts) {
            const script = document.createElement('script');
            script.src = "https://google.com";
            script.onload = () => setupTokenClient(clientId);
            document.head.appendChild(script);
        } else {
            setupTokenClient(clientId);
        }
    }

    function setupTokenClient(clientId) {
        try {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: 'https://googleapis.com',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        document.getElementById('loginBtn').innerText = "✅ Connecté";
                        document.getElementById('loginBtn').style.backgroundColor = "var(--success-color)";
                        log("🔐 Authentification Google réussie via API.");
                    }
                },
            });
        } catch (err) {
            log(`❌ Erreur d'initialisation Auth : ${err.message}`);
        }
    }

    function handleAuthClick() {
        const clientId = document.getElementById('clientIdInput').value.trim();
        if (!clientId) {
            log("❌ Veuillez renseigner votre ID Client OAuth 2.0 d'abord.");
            return;
        }
        if (!tokenClient) {
            setupTokenClient(clientId);
        }
        // Demande l'ouverture de la pop-up de connexion Google
        tokenClient.requestAccessToken({prompt: 'consent'});
    }

    // ⏱️ Orchestration et planification
    function scheduleLiveBroadcast() {
        const start = document.getElementById('startTime').value;
        const end = document.getElementById('endTime').value;

        if (!start || !end) {
            log("❌ Erreur : Veuillez définir une heure de début et de fin.");
            return;
        }

        const startTimeMs = new Date(start).getTime();
        const endTimeMs = new Date(end).getTime();
        const now = Date.now();

        if (endTimeMs <= startTimeMs) {
            log("❌ Erreur : L'heure de fin doit être après l'heure de début.");
            return;
        }

        log(`⏱️ Diffusion planifiée. Début : ${new Date(startTimeMs).toLocaleTimeString()} | Fin : ${new Date(endTimeMs).toLocaleTimeString()}`);
        
        // Système de vérification d'état
        const checker = setInterval(() => {
            const currentTime = Date.now();
            if (currentTime >= startTimeMs && currentTime < endTimeMs) {
                log("🚀 Le direct est actuellement actif (Tranche horaire valide).");
                clearInterval(checker);
            } else if (currentTime >= endTimeMs) {
                log("🏁 Période de diffusion terminée.");
                clearInterval(checker);
            }
        }, 10000); // Vérification toutes les 10 secondes
    }
</script>
